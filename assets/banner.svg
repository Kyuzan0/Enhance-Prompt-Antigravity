<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Antigravity IDE Prompt Enhancer Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a3b"/>
      <stop offset="100%" stop-color="#0b1229"/>
    </linearGradient>
    <linearGradient id="goldSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Outer card with explicit dark surface and crisp border for Light & Dark GitHub themes -->
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="2" width="1276" height="356" rx="20" fill="url(#gridPattern)" opacity="0.45"/>
  <circle cx="180" cy="140" r="190" fill="url(#glowAmber)"/>
  <circle cx="1080" cy="210" r="220" fill="url(#glowCyan)"/>

  <!-- Left: Brand Emblem (squircle matching assets/icon.png) -->
  <g transform="translate(56, 72)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#iconGrad)" stroke="#3b5998" stroke-width="3"/>
    <!-- Main golden 4-point star -->
    <path d="M44 18 C46 35, 51 40, 68 42 C51 44, 46 49, 44 66 C42 49, 37 44, 20 42 C37 40, 42 35, 44 18 Z" fill="#facc15"/>
    <!-- Top-right cyan star -->
    <path d="M72 17 C73 24, 75 26, 82 27 C75 28, 73 30, 72 37 C71 30, 69 28, 62 27 C69 26, 71 24, 72 17 Z" fill="#67e8f9"/>
    <!-- Bottom-right violet star -->
    <path d="M71 58 C71.7 62.5, 73 63.8, 77.5 64.5 C73 65.2, 71.7 66.5, 71 71 C70.3 66.5, 69 65.2, 64.5 64.5 C69 63.8, 70.3 62.5, 71 58 Z" fill="#a78bfa"/>
  </g>

  <!-- Left: Title, Subtitle, Feature Pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
    <text x="176" y="108" fill="#f8fafc" font-size="34" font-weight="700" letter-spacing="-0.4">Antigravity IDE Prompt Enhancer</text>
    <text x="176" y="144" fill="#cbd5e1" font-size="17" font-weight="400">1-click in-place prompt enhancement inside Antigravity IDE</text>
    <text x="176" y="168" fill="#94a3b8" font-size="15" font-weight="400">Preserves @mentions, file chips &amp; attachments — powered by local agy -p strict mode</text>

    <!-- Feature Pills -->
    <g transform="translate(56, 214)" font-size="13.5" font-weight="600">
      <rect x="0" y="0" width="114" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="57" y="21" text-anchor="middle" fill="#fde047">Ctrl+Alt+E</text>

      <rect x="126" y="0" width="136" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="194" y="21" text-anchor="middle" fill="#67e8f9">Quick Settings</text>

      <rect x="274" y="0" width="124" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="336" y="21" text-anchor="middle" fill="#a78bfa">1-Click Undo</text>

      <rect x="410" y="0" width="144" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="482" y="21" text-anchor="middle" fill="#86efac">@mentions Safe</text>

      <rect x="566" y="0" width="112" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="622" y="21" text-anchor="middle" fill="#93c5fd">Open VSX</text>
    </g>

    <text x="56" y="310" fill="#64748b" font-size="13.5" font-weight="500">kyuzan0.ag-ide-prompt-enhancer  ·  MIT License  ·  By Kyuzan0</text>
  </g>

  <!-- Right: Compact Chat Composer Preview -->
  <g transform="translate(772, 52)">
    <rect x="0" y="0" width="456" height="256" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect x="0" y="0" width="456" height="38" rx="16" fill="#1e293b"/>
    <rect x="0" y="22" width="456" height="16" fill="#1e293b"/>
    <circle cx="22" cy="19" r="5" fill="#475569"/>
    <circle cx="38" cy="19" r="5" fill="#475569"/>
    <circle cx="54" cy="19" r="5" fill="#475569"/>
    <text x="74" y="23" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Antigravity Chat Composer</text>

    <!-- Toast Pill -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="236" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="17" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Enhanced in 1.4s · +28 words</text>
      <rect x="184" y="4" width="44" height="18" rx="9" fill="#047857"/>
      <text x="206" y="16" text-anchor="middle" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Undo</text>
    </g>

    <!-- Prompt Content Area -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="416" height="104" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Refactor</text>
      <!-- Preserved Lexical Chip -->
      <rect x="72" y="9" width="112" height="22" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="128" y="24" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600">@extension.js</text>
      <text x="192" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">to add HTTP/WS</text>
      <text x="14" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">failover on ECONNREFUSED, preserve HMAC port</text>
      <text x="14" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">signing, and verify with unit tests in</text>
      <rect x="14" y="76" width="184" height="20" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="106" y="90" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">@ide-extension.test.mjs</text>
    </g>

    <!-- Composer Action Toolbar -->
    <g transform="translate(20, 206)">
      <text x="2" y="21" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Preset: General · Balanced</text>

      <!-- Enhance Button -->
      <rect x="292" y="0" width="38" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M311 7 C312 13, 313.5 14.5, 319.5 15.5 C313.5 16.5, 312 18, 311 24 C310 18, 308.5 16.5, 302.5 15.5 C308.5 14.5, 310 13, 311 7 Z" fill="#facc15"/>

      <!-- Settings Gear Button -->
      <rect x="338" y="0" width="32" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="354" cy="16" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/>

      <!-- Send Button -->
      <rect x="378" y="0" width="38" height="32" rx="8" fill="#2563eb"/>
      <path d="M391 16 L403 16 M398 11 L403 16 L398 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
