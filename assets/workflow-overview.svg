<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Antigravity IDE Prompt Enhancer Architecture Workflow">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="296" rx="18" fill="url(#wfBg)" stroke="#334155" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
    <text x="40" y="42" fill="#f8fafc" font-size="16" font-weight="700">Alur Kerja Aman &amp; Hemat Token</text>
    <text x="1160" y="42" text-anchor="end" fill="#64748b" font-size="13">Loopback Reverse Proxy · Strict Containment</text>

    <!-- Step 1 -->
    <g transform="translate(40, 68)">
      <rect x="0" y="0" width="336" height="196" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="18" y="18" width="96" height="24" rx="12" fill="#1e3a8a"/>
      <text x="66" y="34" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">1. DRAFT</text>
      <text x="18" y="68" fill="#f8fafc" font-size="17" font-weight="700">Serialisasi Lexical &amp; Konteks</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="13">• Membaca draf dari editor chat aktif</text>
      <text x="18" y="118" fill="#cbd5e1" font-size="13">• Mengamankan @mentions &amp; file chips</text>
      <text x="18" y="140" fill="#cbd5e1" font-size="13">  menjadi token [[AGY_CHIP_N]]</text>
      <text x="18" y="164" fill="#94a3b8" font-size="12.5">+ Konteks workspace &amp; pesan terbaru</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M386 166 L422 166 M414 159 L422 166 L414 173" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 2 -->
    <g transform="translate(432, 68)">
      <rect x="0" y="0" width="336" height="196" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="18" y="18" width="134" height="24" rx="12" fill="#451a03"/>
      <text x="85" y="34" text-anchor="middle" fill="#fde047" font-size="12" font-weight="700">2. STRICT ENHANCE</text>
      <text x="18" y="68" fill="#f8fafc" font-size="17" font-weight="700">Proxy Lokal + agy -p</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="13">• Loopback 127.0.0.1:47831 (token + HMAC)</text>
      <text x="18" y="118" fill="#cbd5e1" font-size="13">• Trusted-Types safe + origin check ketat</text>
      <text x="18" y="140" fill="#cbd5e1" font-size="13">• toolPermission: "strict" (tanpa eksekusi)</text>
      <text x="18" y="164" fill="#94a3b8" font-size="12.5">• Bisa dibatalkan instan (AbortController)</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M778 166 L814 166 M806 159 L814 166 L806 173" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Step 3 -->
    <g transform="translate(824, 68)">
      <rect x="0" y="0" width="336" height="196" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <rect x="18" y="18" width="128" height="24" rx="12" fill="#064e3b"/>
      <text x="82" y="34" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">3. IN-PLACE</text>
      <text x="18" y="68" fill="#f8fafc" font-size="17" font-weight="700">Tulis Ulang &amp; 1-Click Undo</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="13">• Memulihkan seluruh @mentions &amp; chips</text>
      <text x="18" y="118" fill="#cbd5e1" font-size="13">• Menyuntikkan hasil langsung ke kotak chat</text>
      <text x="18" y="140" fill="#cbd5e1" font-size="13">• Toast ringkasan + tombol 1-Click Undo</text>
      <text x="18" y="164" fill="#94a3b8" font-size="12.5">• Siap kirim tanpa salin-tempel manual</text>
    </g>
  </g>
</svg>
