name: Release & Publish VSIX

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Verify, Tag & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check_version.outputs.should_release }}
      tag: ${{ steps.check_version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify scripts, version, tests, and contracts
        run: npm run verify

      - name: Check if package.json version is already tagged
        id: check_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists on origin; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} not found on origin; proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build VSIX package
        if: steps.check_version.outputs.should_release == 'true'
        run: npm run package

      - name: Upload VSIX build artifact
        if: steps.check_version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          retention-days: 7
          path: |
            build/ag-ide-prompt-enhancer-*.vsix
            build/SHA256SUMS.txt
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG.md
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          node -e '
            const fs = require("node:fs");
            const version = require("./package.json").version;
            const md = fs.readFileSync("CHANGELOG.md", "utf8").replace(/\r\n/g, "\n");
            const header = "## [" + version + "]";
            const start = md.indexOf(header);
            if (start !== -1) {
              const afterHeader = md.indexOf("\n", start) + 1;
              const nextMatch = md.slice(afterHeader).match(/\n## \[/);
              const end = nextMatch ? afterHeader + nextMatch.index : md.length;
              fs.writeFileSync("release-notes.md", md.slice(afterHeader, end).trim() + "\n", "utf8");
            } else {
              fs.writeFileSync("release-notes.md", "Release v" + version + "\n", "utf8");
            }
          '

      - name: Create GitHub Release & Tag
        if: steps.check_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: Release ${{ steps.check_version.outputs.tag }}
          body_path: release-notes.md
          files: |
            build/ag-ide-prompt-enhancer-*.vsix
            build/SHA256SUMS.txt

  publish-openvsx:
    name: Publish to Open VSX
    needs: build-and-release
    if: needs.build-and-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download VSIX build artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to Open VSX via Trusted Publishing (OIDC)
        run: npx --yes ovsx@latest publish build/ag-ide-prompt-enhancer-*.vsix

  publish-vs-marketplace:
    name: Publish to VS Marketplace
    needs: build-and-release
    if: needs.build-and-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download VSIX build artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath build/ag-ide-prompt-enhancer-*.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT not set; skipping Visual Studio Marketplace publish."
          fi
