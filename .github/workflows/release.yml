name: Release & Publish VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify syntax, unit tests, and contracts
        run: npm run verify

      - name: Build VSIX package
        run: npm run package

      - name: Upload VSIX build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: build/ag-ide-prompt-enhancer-*.vsix
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ag-ide-prompt-enhancer-*.vsix
          generate_release_notes: true

  publish-openvsx:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download VSIX build artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish to Open VSX via Trusted Publishing (OIDC)
        run: npx --yes ovsx@latest publish build/ag-ide-prompt-enhancer-*.vsix

  publish-vs-marketplace:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download VSIX build artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath build/ag-ide-prompt-enhancer-*.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT not set; skipping Visual Studio Marketplace publish."
          fi
