name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify & Package VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify scripts, version, tests, and contracts
        run: npm run verify

      - name: Build VSIX package
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ag-ide-prompt-enhancer-vsix
          retention-days: 7
          path: |
            build/ag-ide-prompt-enhancer-*.vsix
            build/SHA256SUMS.txt
          if-no-files-found: error
